[project]
name = "rustinfer-python-tools"
version = "1.0.1"
requires-python = ">=3.12"
dependencies = []

[project.optional-dependencies]
triton = ["triton==3.6.0"]
cute-dsl = ["nvidia-cutlass-dsl==4.7.1; sys_platform == 'linux' and platform_machine == 'x86_64'"]
tilelang = ["tilelang==0.1.14; sys_platform == 'linux' and platform_machine == 'x86_64'"]
bench = [
    "aiohttp>=3.10,<4",
    "matplotlib>=3.9,<4",
    "numpy>=2,<3",
]
vllm-reference = ["vllm>=0.10"]
sglang-reference = ["sglang>=0.4"]
deepseek-v4-reference = [
    "torch==2.11.0",
    "transformers==5.12.0",
    "safetensors==0.8.0",
    "numpy>=2,<3",
]

[tool.uv]
package = false

# The vLLM reference engine pins its own TileLang and CuTe DSL compilers.
# Install Rust AOT compilers separately from that reference environment.
conflicts = [
    [{ extra = "tilelang" }, { extra = "vllm-reference" }],
    [{ extra = "cute-dsl" }, { extra = "vllm-reference" }],
]
