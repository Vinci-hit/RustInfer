# RustInfer shared launch config.
#
# One file drives all processes: rustinfer-scheduler, rustinfer-worker,
# rustinfer-server. Each binary takes only `--config <path>` (defaults to
# ./rustinfer.toml).
#
# `model_type` is intentionally NOT here — it is resolved from the model's
# config.json so the worker dispatch / chat template always match the weights.

# Model directory (weights + tokenizer.json + config.json). Required.
model = "/mnt/md2/liuwenqi/vllm_bench/dir"

# Display name for /v1/models. Empty => derive from `model` basename.
model_name = ""

# Cluster id. All four IPC endpoints derive from this. Use a distinct id to
# run multiple independent instances on the same host.
cluster_id = "rustinfer"

# CUDA device.
device = "cuda:7"

# HTTP API server.
host = "0.0.0.0"
port = 8000
request_timeout_secs = 600

# Batching / capacity.
max_batch_tokens = 8192
max_batch_seqs = 256
max_model_len = 1024

# Throughput knob: max time (ms) the scheduler waits accumulating freshly
# arrived requests into one larger prefill batch before dispatching.
# 0 => low-latency mode (dispatch each request immediately, no waiting).
# Non-zero trades up to this much TTFT for higher throughput under high QPS.
batch_wait_ms = 0

# Paged KV.
paged_block_size = 1
chunked_prefill_size = 0      # 0 => disabled (whole prompt in one step). Set 256 to re-enable the graph-prefill foundation (see docs/HANDOFF_graph_prefill.md)
enable_prefix_caching = false
mem_fraction_static = 0.9
num_blocks = 0                # 0 => auto-size

# Generation.
ignore_eos = true

# Scheduler mode: "llm" or "diffusion".
mode = "llm"

# Worker.
worker_id = "worker-0"

# Logging.
log_level = "info"

# CUDA graph capture sizes for decode batches.
# Determines which batch sizes have pre-captured CUDA graphs.
# Batch sizes not in this list will fall back to eager mode.
# Matched to vLLM 0.23.0 default FULL-cudagraph decode sizes (max_num_seqs=256):
# [1,2,4] + multiples of 8 up to 256. vLLM's 272..512 entries are chunked-prefill
# token batches (piecewise), not pure decode, so excluded — decode batch is capped
# at max_batch_seqs=256. Apples-to-apples decode graph capture vs vLLM.
capture_sizes = [1, 2, 4, 8, 16, 24, 32, 40, 48, 56, 64, 72, 80, 88, 96, 104, 112, 120, 128, 136, 144, 152, 160, 168, 176, 184, 192, 200, 208, 216, 224, 232, 240, 248, 256]
