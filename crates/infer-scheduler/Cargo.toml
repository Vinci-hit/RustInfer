[package]
name = "infer-scheduler"
version = "0.2.0"
edition = "2024"

[[bin]]
name = "rustinfer-scheduler"
path = "src/main.rs"

[dependencies]
# Protocol
infer-protocol = { path = "../infer-protocol" }

# Async runtime
tokio = { version = "1", features = ["full"] }

# Serialization
rmp-serde = "1.3"
serde = { version = "1", features = ["derive"] }

# Error handling
thiserror = "2"
anyhow = "1.0"

# ZMQ (synchronous — used in dedicated I/O thread via spawn_blocking)
zmq = "0.10"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# CLI
clap = { version = "4.5", features = ["derive"] }

# Utils
uuid = { version = "1.19", features = ["v4"] }
hashbrown = "0.15"
slotmap = "1"

# Async trait
async-trait = "0.1"

# Metrics (optional)
prometheus = { version = "0.13", optional = true }

[dev-dependencies]
tokio = { version = "1", features = ["test-util", "macros"] }

[features]
default = ["metrics"]
metrics = ["dep:prometheus"]
prefix-caching = []
radix-tree = ["prefix-caching"]
chunked-prefill = []
priority-scheduling = []
