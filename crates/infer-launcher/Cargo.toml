[package]
name = "infer-launcher"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "rustinfer-launch"
path = "src/main.rs"

[dependencies]
tokio = { version = "1", features = ["full"] }
clap = { version = "4.5", features = ["derive"] }
anyhow = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
nix = { version = "0.29", features = ["signal"] }
