[package]
name = "infer-protocol"
version = "0.1.0"
edition = "2024"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
rmp-serde = "1.3"          # MessagePack 序列化
serde_json = "1.0"         # model config.json parsing
toml = "0.8"               # launch config file
uuid = { version = "1.19", features = ["v4", "serde"] }
