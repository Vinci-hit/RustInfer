[package]
name = "infer-frontend"
version = "0.3.0"
edition = "2021"

[[bin]]
name = "rustinfer-frontend"
path = "src/main.rs"

[dependencies]
# Dioxus 0.7 web framework
dioxus = { version = "0.7.9", features = ["web"] }

# HTTP client (WASM-compatible)
reqwest = { version = "0.12", features = ["json"] }
gloo-net = { version = "0.6", features = ["eventsource"] }
gloo-timers = { version = "0.3", features = ["futures"] }

# Web APIs for SSE streaming
web-sys = { version = "0.3", features = [
    "EventSource",
    "MessageEvent",
    "Window",
    "Storage",
    "HtmlTextAreaElement",
] }
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"

# Markdown rendering
pulldown-cmark = { version = "0.12", default-features = false, features = ["html"] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Error handling
anyhow = "1.0"

# Logging
tracing = "0.1"
tracing-wasm = "0.2"

# Time
chrono = { version = "0.4", features = ["wasmbind"] }

# UUID
uuid = { version = "1.19", features = ["v4", "serde", "js"] }
