[package]
name = "infer-core"
version = "0.1.0"
edition = "2024"
description = "RustInfer foundation crate: dtypes, the extended DTypeId/quant scheme, value types (Shape/Strides/Dims/DataType), and the OpError family. Builds with rustc only — the GPU-free bottom of the dependency DAG."
license = "Apache-2.0"

[dependencies]
infer-protocol = { path = "../infer-protocol" }
half = { version = "2.7.1", features = ["std", "num-traits"] }
thiserror = "2.0.17"
