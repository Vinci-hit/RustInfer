[package]
name = "infer-worker"
version = "0.1.0"
edition = "2024"
description = "RustInfer Worker: GPU inference runtime with DDD architecture (domain/infra/app)"

[[bin]]
name = "rustinfer-worker"
path = "src/bin/worker_main.rs"
required-features = ["cuda"]

[[example]]
name = "zimage_demo"
required-features = ["cuda"]

[dependencies]
infer-protocol = { path = "../infer-protocol" }
infer-core = { path = "../infer-core" }
infer-backend-cpu = { path = "../infer-backend-cpu" }
infer-backend-cuda = { path = "../infer-backend-cuda", optional = true }
half = { version = "2.7.1", features = ["std", "num-traits"] }
thiserror = "2.0.17"
num-traits = "0.2.19"
dashmap = "6.1.0"
once_cell = "1.21.3"
rayon = "1.11.0"
safetensors = "0.6.2"
memmap2 = "0.9"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
rmp-serde = "1.3"
clap = { version = "4", features = ["derive"] }
zmq = "0.10"
tokenizers = "0.22.2"
anyhow = "1"
png = "0.17"

[features]
default = ["cuda"]
# CUDA is now a statically-linked backend crate, not an in-tree kernel build.
# The worker no longer carries cc/bindgen/walkdir or a build.rs — the CUDA
# toolchain lives entirely in `infer-backend-cuda`.
cuda = ["dep:infer-backend-cuda"]
