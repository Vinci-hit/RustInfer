[package]
name = "infer-worker"
version = "0.1.0"
edition = "2024"

# High-level model/worker binary is gated behind the `models` feature —
# see `src/lib.rs`. Building the crate without `models` exercises only
# the tensor / op / cuda infrastructure.
[[bin]]
name = "rustinfer-worker"
path = "src/bin/worker_main.rs"
required-features = ["models"]

[dependencies]
anyhow = "1.0.100"
dashmap = "6.1.0"
half = { version = "2.7.1", features = ["std","num-traits"] }
libc = "0.2.180"
memmap2 = "0.9.9"
ndarray = { version = "0.16.1", features = ["rayon"] }
ndarray-linalg = { version = "0.17.0", features = ["openblas-system"] }
num-traits = "0.2.19"
once_cell = "1.21.3"
rayon = "1.11.0"
safetensors = "0.6.2"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
thiserror = "2.0.17"
tokenizers = "0.22.2"
rand = "0.9.2"

# Worker 进程依赖
zmq = "0.10"
rmp-serde = "1.3"
clap = { version = "4.5", features = ["derive"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[build-dependencies]
cc = { version = "1.2.52", features = ["parallel"] , optional = true }
bindgen = { version ="0.72.1", optional = true }
walkdir = {version = "2.5.0" , optional = true}
[dev-dependencies]
[features]
default = ["cuda"]
cuda = ["dep:cc", "dep:bindgen", "dep:walkdir"]
# Enable the high-level model / worker layer (LLM + diffusion pipelines,
# zmq-based worker server, `rustinfer-worker` binary). Leave disabled
# while rebuilding the tensor foundation.
models = []
qwen3 = ["models"]
