[package]
name = "infer-worker"
version = "0.1.0"
edition = "2024"
description = "RustInfer Worker: GPU inference runtime with DDD architecture (domain/infra/app)"

[[bin]]
name = "rustinfer-worker"
path = "src/bin/worker_main.rs"

[[bin]]
name = "llama3_demo"
path = "src/bin/llama3_demo.rs"
required-features = ["cuda", "demo"]

[dependencies]
infer-protocol = { path = "../infer-protocol" }
half = { version = "2.7.1", features = ["std", "num-traits"] }
thiserror = "2.0.17"
num-traits = "0.2.19"
dashmap = "6.1.0"
once_cell = "1.21.3"
rayon = "1.11.0"
safetensors = "0.6.2"
memmap2 = "0.9"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
rmp-serde = "1.3"
clap = { version = "4", features = ["derive"] }
zmq = "0.10"
tokenizers = { version = "0.22.2", optional = true }
anyhow = { version = "1", optional = true }

[build-dependencies]
cc = { version = "1.2.52", features = ["parallel"], optional = true }
bindgen = { version = "0.72.1", optional = true }
walkdir = { version = "2.5.0", optional = true }

[features]
default = ["cuda"]
cuda = ["dep:cc", "dep:bindgen", "dep:walkdir"]
# Pulls in tokenizers + anyhow for the standalone llama3 demo binary.
demo = ["dep:tokenizers", "dep:anyhow"]
