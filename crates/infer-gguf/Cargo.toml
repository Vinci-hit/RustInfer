[package]
name = "infer-gguf"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
description = "GGUF reader and optional Qwen35 tokenizer/chat templates, without inference backends."

[dependencies]
infer-core = { version = "1.0.1", path = "../infer-core" }
memmap2 = "0.9"
thiserror = "2.0.17"
anyhow = { version = "1", optional = true }
serde = { version = "1.0", features = ["derive"], optional = true }
serde_json = { version = "1.0", optional = true }
tokenizers = { version = "0.23.1", optional = true }
minijinja = { version = "2.24", features = ["json"], optional = true }
minijinja-contrib = { version = "2.24", features = ["pycompat"], optional = true }

[features]
default = []
text = ["dep:anyhow", "dep:serde", "dep:serde_json", "dep:tokenizers", "dep:minijinja", "dep:minijinja-contrib"]

[dev-dependencies]
serde_json = "1.0"
